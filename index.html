<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Detect statistically significant Earth system trends with decades of NASA POWER data." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><style>path{stroke:%23000}@media (prefers-color-scheme:dark){path{stroke:%23fff}}</style><path d='M50 11.25 88.75 50 50 88.75 11.25 50Z' fill='none' stroke-width='7.07'/></svg>" />
    <title>Earth Trends Nexus</title>
    <script>
      // Apply the saved (or system) colour scheme before the first paint.
      (function () {
        var scheme;
        try { scheme = localStorage.getItem("color-scheme"); } catch (e) {}
        if (scheme !== "light" && scheme !== "dark") {
          scheme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
