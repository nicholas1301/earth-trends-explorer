<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Detect statistically significant Earth system trends with decades of NASA POWER data." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='white'/><circle cx='50' cy='50' r='34' fill='none' stroke='black' stroke-width='9'/><path d='M50 50 72 30' stroke='%23e1230f' stroke-width='9' stroke-linecap='round'/></svg>" />
    <title>Earth Trends Detective</title>
    <script>
      // Apply the saved (or system) colour scheme before the first paint.
      (function () {
        var scheme;
        try { scheme = localStorage.getItem("color-scheme"); } catch (e) {}
        if (scheme !== "light" && scheme !== "dark") {
          scheme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = scheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
